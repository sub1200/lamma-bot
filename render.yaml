services:
  - type: web
    name: lamma-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FACEBOOK_APP_ID
        value: "1003598975454937"
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: BASE_URL
        sync: false
