services:
  - type: web
    name: lamma-bot
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FACEBOOK_APP_ID
        value: "1003598975454937"
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: GITHUB_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
